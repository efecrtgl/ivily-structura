name: Release

# On a vX.Y.Z tag:
#   1. verify the tag matches the app version,
#   2. run UI and Rust tests,
#   3. build the Windows x64 NSIS installer and sign the updater package,
#   4. verify the artifacts (installer, signature, version metadata),
#   5. create a DRAFT GitHub release with latest.json, a portable zip and SHA-256 sums.
# The draft is published manually after review. Nothing is published if any step fails.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Tag matches app version
        shell: pwsh
        run: ./scripts/check-version.ps1 -Tag "${{ github.ref_name }}"

      - run: npm ci
      - run: npm test
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Signing key must be configured
        shell: pwsh
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:KEY) { Write-Error "Secret TAURI_SIGNING_PRIVATE_KEY is not set. See docs/RELEASING.md"; exit 1 }

      - name: Build, sign and create draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Ivily Structura ${{ github.ref_name }}"
          releaseBody: "See CHANGELOG.md for the changes in this release. Verify downloads with SHA256SUMS.txt."
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Verify artifacts
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          $dir = "src-tauri/target/release/bundle/nsis"
          $exe = Join-Path $dir "Ivily Structura_${v}_x64-setup.exe"
          if (-not (Test-Path $exe)) { Write-Error "Installer not found: $exe"; exit 1 }
          if (-not (Test-Path "$exe.sig")) { Write-Error "Updater signature not found"; exit 1 }
          if ((Get-Item $exe).Length -lt 1MB) { Write-Error "Installer is unexpectedly small"; exit 1 }
          $app = "src-tauri/target/release/ivily-structura.exe"
          $appVer = (Get-Item $app).VersionInfo.ProductVersion
          if (-not $appVer.StartsWith($v.Split('-')[0])) { Write-Error "App version ($appVer) does not match tag ($v)"; exit 1 }
          Write-Host "Installer OK: $exe ($([math]::Round((Get-Item $exe).Length/1MB,2)) MB), app $appVer"

      - name: Portable zip and SHA-256 checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          $out = "dist-release"
          $stage = Join-Path $out "Ivily Structura"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item src-tauri/target/release/ivily-structura.exe (Join-Path $stage "Ivily Structura.exe")
          @"
          Ivily Structura $v - portable

          Run "Ivily Structura.exe". Requires the Microsoft Edge WebView2 Runtime (included in Windows 11).
          Data is stored in %LOCALAPPDATA%\IvilyStructura. The portable build does not update itself;
          download new versions from GitHub Releases.
          "@ | Set-Content -Encoding utf8 (Join-Path $stage "README.txt")
          $zip = Join-Path $out "Ivily.Structura_${v}_x64_portable.zip"
          Compress-Archive -Path $stage -DestinationPath $zip -Force
          $files = @(Get-ChildItem src-tauri/target/release/bundle/nsis -File) + @(Get-Item $zip)
          # GitHub replaces spaces in asset names with dots; the checksum file uses the uploaded names.
          $lines = $files | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), ($_.Name -replace ' ', '.') }
          $lines | Set-Content -Encoding utf8 "$out/SHA256SUMS.txt"
          gh release upload "${{ github.ref_name }}" "$zip" "$out/SHA256SUMS.txt" --clobber
