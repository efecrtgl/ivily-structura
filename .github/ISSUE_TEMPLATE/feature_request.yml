name: Feature request
description: Suggest a new analysis, language, view or improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: reliability
    attributes:
      label: Reliability
      description: For new analyses — how reliable can detection be? What are the false-positive risks?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
